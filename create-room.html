<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Room - Career Quest</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <div class="glass">
      <h1>🎮 สร้างห้องใหม่</h1>
      
      <div style="margin: 15px 0;">
        <input type="text" id="roomName" placeholder="ชื่อห้อง" style="padding: 10px; width: 80%; margin-bottom: 10px;">
        <input type="text" id="username" placeholder="ชื่อผู้เล่น (Host)" style="padding: 10px; width: 80%; margin-bottom: 10px;">
        <select id="players" style="padding: 10px; width: 85%;">
          <option value="3">3 คน</option>
          <option value="4" selected>4 คน</option>
          <option value="5">5 คน</option>
        </select>
      </div>

      <button class="btn" onclick="createRoom()">🎮 Create Room</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    function createRoom() {
      let roomName = document.getElementById("roomName").value.trim();
      let username = document.getElementById("username").value.trim();
      let maxPlayers = document.getElementById("players").value;

      if (!roomName || !username) {
        alert("กรุณากรอกชื่อห้องและชื่อผู้เล่นให้ครบถ้วน!");
        return;
      }

      // บันทึกชื่อ Host ไว้ใช้งาน
      localStorage.setItem("username", username);

      // ส่งข้อมูลไปสร้างห้อง
      socket.emit("createRoom", { roomName, username, maxPlayers });
    }

    // รอให้ Server ตอบกลับมาก่อนว่าสร้างห้องสำเร็จ + ส่งรหัสห้องมาให้ ถึงค่อยเปลี่ยนหน้า!
    socket.on("roomCreated", (data) => {
      // เซฟทั้ง รหัสห้อง และ QR Code เก็บไว้
      localStorage.setItem("roomCode", data.roomCode);
      localStorage.setItem("qrCodeUrl", data.qrCodeUrl);
      
      // ย้ายไปหน้า Lobby
      window.location.href = "room.html";
    });
  </script>
</body>
</html>
